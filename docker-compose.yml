version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: insightflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-insightflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: runtime
    container_name: insightflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-insightflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DB_NAME: ${POSTGRES_DB:-insightflow}
      # AI service endpoint
      AI_SERVICE_URL: http://ai:8000
      # Application settings (add more as needed)
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai:
    build:
      context: ./src/ai
      dockerfile: Dockerfile
      target: runtime
    container_name: insightflow_ai
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection (if AI needs read‑only access)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-insightflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DB_NAME: ${POSTGRES_DB:-insightflow}
      # Model path – must be baked into the image or mounted as a volume
      MODEL_PATH: /app/model/anomaly_model.pkl
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: insightflow_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # optional TLS certificates
      - ./frontend/build:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    name: insightflow_pgdata
    driver: local